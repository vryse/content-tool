[project]
name = "arup-testing"
version = "0.1.0"
description = "VRYSE editorial writing pipeline API"
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=0.3,<1",
    "langchain-google-genai>=2.0,<3",
    "langchain-openai>=0.3,<1",
    "aerich>=0.8,<1",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "sentence-transformers>=3.0,<4",
    "textstat>=0.7,<1",
    "tortoise-orm[asyncpg]>=0.25,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.aerich]
tortoise_orm = "aerich_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "."
